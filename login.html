<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#fff7fa">

    <title>Đăng nhập | Fubao</title>

    <link rel="manifest" href="manifest.json">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <meta name="apple-mobile-web-app-title" content="Fubao">

    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <main class="login-container">

        <section class="login-heading">
            <div class="login-logo">🌷</div>

            <p class="login-label">
                CHÀO MỪNG TRỞ LẠI
            </p>

            <h1>Fubao</h1>

            <p class="login-description">
                Đăng nhập để xem và cập nhật lịch trình
            </p>
        </section>

        <form class="login-form" id="loginForm">

            <div class="login-form-group">
                <label for="loginEmail">
                    Email
                </label>

                <input id="loginEmail" name="email" type="email" placeholder="Nhập địa chỉ email" autocomplete="email"
                    required>
            </div>

            <div class="login-form-group">
                <label for="loginPassword">
                    Mật khẩu
                </label>

                <input id="loginPassword" name="password" type="password" placeholder="Nhập mật khẩu"
                    autocomplete="current-password" required>
            </div>

            <p class="login-message" id="loginMessage" aria-live="polite"></p>

            <button class="login-button" id="loginButton" type="submit">
                Đăng nhập
            </button>

        </form>

        <p class="login-footer">
            Tài khoản mới chỉ được tạo bởi quản trị viên.
        </p>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="auth.js"></script>
    <script src="pwa.js"></script>
</body>

</html>
