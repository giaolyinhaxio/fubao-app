<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#eef8f1">

    <title>Từ vựng | FuBao</title>

    <link rel="manifest" href="manifest.json">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <meta name="apple-mobile-web-app-title" content="FuBao">

    <link rel="stylesheet" href="style.css?v=49HỌsst5st0">
</head>

<body class="tioong-page vocabulary-home-page">

    <div class="app-container sub-page-container">

        <header class="sub-page-header">
            <a class="back-button" href="english.html">
                <span>‹</span>
                Học tiếng Anh
            </a>
        </header>

        <section class="vocabulary-heading">
            <p>HỌC TIẾNG ANH</p>

            <h1>Từ vựng</h1>

            <span>
                Chọn nội dung bạn muốn học
            </span>
        </section>

        <a class="vocabulary-list-link" href="vocabulary-list.html">

            <span>🔎</span>

            <div>
                <strong>Danh sách từ vựng</strong>

                <small>
                    Xem và tìm kiếm trong kho từ
                </small>
            </div>

            <b>›</b>
        </a>

        <section class="vocabulary-statistics">

            <article>
                <strong id="totalVocabularyCount">
                    ...
                </strong>

                <span>Tổng số từ</span>
            </article>

            <article>
                <strong id="studiedVocabularyCount">
                    ...
                </strong>

                <span>Đã học</span>
            </article>

            <article>
                <strong id="dueVocabularyCount">
                    ...
                </strong>

                <span>Cần ôn</span>
            </article>

        </section>

        <section class="vocabulary-today-result">

            <div class="today-result-icon">
                ✨
            </div>

            <div class="today-result-content">

                <span>
                    HÔM NAY ĐÃ HỌC
                </span>

                <p>
                    <strong id="todayVocabularyCount">
                        0
                    </strong>

                    từ
                </p>

                <small id="todayVocabularyMessage">
                    Đang tải kết quả hôm nay...
                </small>

            </div>

        </section>

        <section class="vocabulary-mode-selector" aria-label="Chọn chế độ học">

            <a class="vocabulary-mode-button" href="flashcard.html?mode=new">

                <strong>Học từ mới</strong>

                <span>
                    Những từ chưa học
                </span>

                <b>›</b>
            </a>

            <a class="vocabulary-mode-button" href="flashcard.html?mode=review">

                <strong>Ôn tập</strong>

                <span>
                    Những từ đã đến hạn
                </span>

                <b>›</b>
            </a>

        </section>

        <section class="vocabulary-session-setting">

            <label for="sessionSizeSelect">
                Số từ mỗi lượt
            </label>

            <select id="sessionSizeSelect">

                <option value="5">
                    5 từ
                </option>

                <option value="10">
                    10 từ
                </option>

                <option value="20">
                    20 từ
                </option>

            </select>

        </section>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase-config.js"></script>

    <script src="auth-guard.js"></script>

    <script src="vocabulary-home.js?v=2"></script>

    <script src="pwa.js"></script>

</body>

</html>
