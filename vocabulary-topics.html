<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#eef8f1">

    <title>Chủ đề từ vựng | FuBao</title>

    <link rel="manifest" href="manifest.json">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <meta name="apple-mobile-web-app-title" content="FuBao">

    <link rel="stylesheet" href="assets/css/style.css?v=64">

    <link rel="icon" type="image/svg+xml" href="assets/icons/bear-favicon.svg?v=2">
</head>

<body class="tioong-page vocabulary-topics-page">

    <div class="app-container sub-page-container">

        <header class="sub-page-header">

            <a class="back-button" href="english.html">
                <span>‹</span>
                <span>Học tiếng Anh</span>
            </a>

            <button class="vocabulary-topic-add-button" id="openVocabularyTopicFormButton" type="button">
                ＋ Chủ đề
            </button>

        </header>


        <section class="vocabulary-topic-heading">

            <p>CHỦ ĐỀ TỪ VỰNG</p>

            <h1>Từ vựng</h1>

            <span>
                Chọn chủ đề bạn muốn học
            </span>

        </section>


        <main class="vocabulary-topic-container" id="vocabularyTopicContainer">
            <article class="vocabulary-topic-message">
                Đang tải danh sách chủ đề...
            </article>
        </main>

    </div>


    <!-- Form thêm hoặc sửa chủ đề -->

    <div class="reading-form-modal hidden" id="vocabularyTopicFormModal" hidden>
        <section class="reading-form-panel vocabulary-topic-form-panel" role="dialog" aria-modal="true"
            aria-labelledby="vocabularyTopicFormTitle">

            <header class="reading-form-header">

                <div>
                    <p>CHỦ ĐỀ TỪ VỰNG</p>

                    <h2 id="vocabularyTopicFormTitle">
                        Thêm chủ đề
                    </h2>
                </div>

                <button class="reading-form-close" id="closeVocabularyTopicFormButton" type="button" aria-label="Đóng">
                    ×
                </button>

            </header>


            <form id="vocabularyTopicForm">

                <input id="vocabularyTopicId" type="hidden">


                <label for="vocabularyTopicName">
                    Tên chủ đề
                </label>

                <input id="vocabularyTopicName" type="text" maxlength="60" placeholder="Ví dụ: TOEIC" required>


                <label for="vocabularyTopicDescription">
                    Mô tả
                </label>

                <textarea id="vocabularyTopicDescription" maxlength="200" placeholder="Nội dung của chủ đề"></textarea>


                <label for="vocabularyTopicEmoji">
                    Biểu tượng
                </label>

                <input id="vocabularyTopicEmoji" type="text" maxlength="10" value="📚">


                <p class="reading-form-message" id="vocabularyTopicFormMessage"></p>


                <div class="reading-form-actions">

                    <button id="cancelVocabularyTopicFormButton" type="button">
                        Hủy
                    </button>

                    <button class="reading-form-submit" type="submit">
                        Lưu chủ đề
                    </button>

                </div>

            </form>

        </section>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="assets/js/core/supabase-config.js"></script>

    <script src="assets/js/core/auth-guard.js"></script>

    <script src="assets/js/english/vocabulary-topics.js?v=2"></script>

    <script src="assets/js/core/pwa.js"></script>

</body>

</html>
