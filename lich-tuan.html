<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#fff7fa">

    <title>Lịch tuần | Fubao</title>

    <link rel="manifest" href="manifest.json">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <meta name="apple-mobile-web-app-title" content="FuBao">

    <link rel="stylesheet" href="style.css?v=55">
</head>

<body class="week-page">

    <div class="app-container sub-page-container">

        <header class="sub-page-header">
            <a class="back-button" href="diquy.html">
                <span>‹</span>
                Trở lại
            </a>

            <div class="profile-icon">📅</div>
        </header>

        <section class="week-heading">
            <h1 class="week-main-title">
                LỊCH TRÌNH CỦA DIQUY
            </h1>

            <p class="week-timezone-note" id="weekTimezoneNote">
                Đang tải múi giờ...
            </p>
        </section>

        <nav class="week-navigation">
            <button id="previousWeekButton" type="button" aria-label="Tuần trước">
                ‹
            </button>

            <button id="currentWeekButton" type="button" aria-label="Quay về tuần hiện tại">
                <strong>Lịch tuần</strong>

                <span id="weekRange">
                    Đang tải khoảng ngày...
                </span>
            </button>

            <button id="nextWeekButton" type="button" aria-label="Tuần sau">
                ›
            </button>
        </nav>

        <main class="weekly-plan-section">

            <div class="week-table-wrapper">
                <table class="week-plan-table" aria-label="Lịch trình trong tuần">
                    <thead>
                        <tr>
                            <th>Ngày</th>
                            <th>Công việc</th>
                            <th>Học tập</th>
                        </tr>
                    </thead>

                    <tbody id="weekSchedule">
                        <tr class="week-loading-row">
                            <td colspan="3">
                                Đang tải lịch tuần...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </main>

    </div>

    <!-- Cửa sổ thêm giờ tự học -->
    <div class="modal-overlay" id="studySlotModal">
        <section class="shift-modal study-slot-modal">

            <div class="modal-handle"></div>

            <header class="modal-header">
                <div>
                    <p class="section-label">
                        THÊM VÀO LỊCH
                    </p>

                    <h2>Giờ tự học</h2>

                    <p id="studySlotDateLabel">
                        Chưa chọn ngày
                    </p>
                </div>

                <button class="close-modal-button" id="closeStudySlotModalButton" type="button" aria-label="Đóng">
                    ×
                </button>
            </header>

            <form id="studySlotForm">

                <input id="studySlotDate" name="studySlotDate" type="hidden">

                <div class="study-time-grid">

                    <div class="form-group">
                        <label for="studyStartTime">
                            Bắt đầu
                        </label>

                        <input id="studyStartTime" name="studyStartTime" type="time" required>
                    </div>

                    <div class="form-group">
                        <label for="studyEndTime">
                            Kết thúc
                        </label>

                        <input id="studyEndTime" name="studyEndTime" type="time" required>
                    </div>

                </div>

                <p class="study-timezone-help" id="studyTimezoneHelp">
                    Nhập giờ theo múi giờ Việt Nam. App sẽ tự quy đổi khi hiển thị.
                </p>

                <div class="form-group">
                    <label for="studyTitle">
                        Nội dung học
                    </label>

                    <input id="studyTitle" name="studyTitle" type="text" value="Tự học N5" maxlength="80" required>
                </div>

                <button class="save-shift-button" id="saveStudySlotButton" type="submit">
                    ＋ Thêm vào lịch
                </button>

            </form>

        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="auth-guard.js"></script>
    <script src="week.js?v=28"></script>
    <script src="pwa.js"></script>
</body>

</html>
