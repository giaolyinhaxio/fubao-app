<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#eef8f1">

    <title>Danh sách động từ | FuBao</title>

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="assets/css/style.css?v=66">
    <link rel="icon" type="image/svg+xml"
        href="assets/icons/bear-favicon.svg?v=2">

    <style>
        .verb-list-tools {
            display: grid;
            gap: 16px;
            margin-bottom: 24px;
        }

        .verb-list-tabs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .verb-list-tabs a {
            padding: 12px 18px;
            border-radius: 16px;
            background: #f3e7ed;
            color: #725d68;
            text-decoration: none;
            font-weight: 700;
        }

        .verb-list-tabs a[aria-current="page"] {
            background: #86b49f;
            color: white;
        }

        #verbSearch {
            box-sizing: border-box;
            width: 100%;
            min-height: 48px;
            padding: 14px 18px;
            border: 1px solid #dec8d1;
            border-radius: 16px;
            background: white;
            color: #503f49;
            font: inherit;
            font-size: 16px;
        }

        #verbListMessage {
            margin: 16px 0;
            color: #725d68;
        }

        #verbListMessage.error {
            color: #bf476c;
        }

        #verbListContainer {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .verb-list-card {
            min-width: 0;
            padding: 22px;
            border: 1px solid #cde5d8;
            border-radius: 24px;
            background: linear-gradient(135deg, #f1faf5, #fffafd);
        }

        .verb-list-forms {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
            text-align: center;
        }

        .verb-list-forms small {
            display: block;
            margin-bottom: 8px;
            color: #799b88;
            font-weight: 800;
        }

        .verb-list-forms strong {
            display: block;
            color: #503f49;
            font-size: 22px;
            overflow-wrap: anywhere;
        }

        .verb-list-meaning {
            margin: 18px 0 12px;
            color: #725d68;
            text-align: center;
            overflow-wrap: anywhere;
        }

        .verb-list-status {
            display: block;
            width: fit-content;
            margin: 0 auto;
            padding: 6px 12px;
            border-radius: 20px;
            background: #f3e7ed;
            color: #725d68;
            font-size: 13px;
            font-weight: 700;
        }

        .verb-list-status[data-status="known"] {
            background: #dff2e7;
            color: #49785e;
        }

        .verb-list-status[data-status="again"],
        .verb-list-status[data-status="learning"] {
            background: #fff0d2;
            color: #89692e;
        }

        @media (max-width: 650px) {
            #verbListContainer {
                grid-template-columns: 1fr;
            }

            .verb-list-card {
                padding: 18px 14px;
            }

            .verb-list-forms strong {
                font-size: 19px;
            }

            .verb-list-tabs a {
                padding: 12px 14px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body class="tioong-page">
    <div class="app-container sub-page-container">

        <header class="sub-page-header">
            <a class="back-button" href="verbs.html">
                <span>‹</span>
                Động từ
            </a>
        </header>

        <section class="vocabulary-heading">
            <p>ĐỘNG TỪ</p>
            <h1 id="verbListTitle">Danh sách</h1>
        </section>

        <main>
            <div class="verb-list-tools">
                <nav class="verb-list-tabs" aria-label="Lọc động từ">
                    <a href="verb-list.html?filter=all"
                        data-filter="all">Tất cả</a>
                    <a href="verb-list.html?filter=known"
                        data-filter="known">Đã nhớ</a>
                    <a href="verb-list.html?filter=review"
                        data-filter="review">Cần ôn</a>
                </nav>

                <label for="verbSearch">Tìm động từ</label>
                <input id="verbSearch" type="search"
                    placeholder="Nhập V1, V2, V3 hoặc nghĩa tiếng Việt…"
                    autocomplete="off" disabled>
            </div>

            <p id="verbListMessage" role="status"
                aria-live="polite">Đang tải danh sách…</p>

            <div id="verbListContainer"></div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/core/supabase-config.js"></script>
    <script src="assets/js/core/auth-guard.js"></script>
    <script src="assets/js/english/verb-list.js?v=1"></script>
    <script src="assets/js/core/pwa.js"></script>
</body>
</html>
