<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#eef8f1">

    <title>Đọc bài | FuBao</title>

    <link rel="manifest" href="manifest.json">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <meta name="apple-mobile-web-app-title" content="FuBao">

    <link rel="stylesheet" href="assets/css/style.css?v=43">

    <link rel="icon" type="image/svg+xml" href="assets/icons/bear-favicon.svg?v=2">
</head>

<body class="tioong-page">

    <div class="app-container sub-page-container">

        <header class="sub-page-header">
            <a class="back-button" href="reading-list.html">
                <span>‹</span>
                Luyện đọc
            </a>
        </header>


        <section class="reading-page-message" id="readingLoading">
            Đang tải bài đọc...
        </section>


        <section class="reading-page-message reading-page-error hidden" id="readingError"></section>


        <main class="reading-workspace hidden" id="readingWorkspace">
            <section class="reading-page-heading">
                <p>ENGLISH READING</p>

                <h1 id="readingTitle">
                    Bài luyện đọc
                </h1>

                <span>
                    Nghe và đọc theo từng câu
                </span>
            </section>


            <section class="reading-audio-panel">

                <div class="reading-audio-main-actions">
                    <button class="reading-play-button" id="readingPlayButton" type="button" aria-label="Đọc bài"
                        title="Đọc bài">
                        🔊
                    </button>

                    <button id="readingPauseButton" type="button" aria-label="Tạm dừng" title="Tạm dừng" disabled>
                        ⏸
                    </button>

                    <button id="readingStopButton" type="button" aria-label="Dừng đọc" title="Dừng đọc" disabled>
                        ⏹
                    </button>
                </div>


                <label class="reading-speed-control">
                    <span>Tốc độ đọc</span>

                    <select id="readingRateSelect">
                        <option value="0.75">
                            Chậm — 0.75×
                        </option>

                        <option value="1" selected>
                            Bình thường — 1×
                        </option>

                        <option value="1.25">
                            Nhanh — 1.25×
                        </option>
                    </select>
                </label>


                <div class="reading-speech-status" id="readingSpeechStatus" aria-live="polite">
                    Sẵn sàng đọc
                </div>


                <div class="reading-progress">
                    <div class="reading-progress-track">
                        <span id="readingProgressFill"></span>
                    </div>

                    <span id="readingProgressText">
                        0/0 câu
                    </span>
                </div>

            </section>


            <section class="reading-language-section">

                <header class="reading-language-header">

                    <div>
                        <p>ENGLISH · TIẾNG VIỆT</p>

                        <h2>Nội dung bài đọc</h2>
                    </div>

                    <div class="reading-language-actions">

                        <button id="readFromBeginningButton" type="button">
                            ↻ Đọc từ đầu
                        </button>

                        <button id="toggleTranslationButton" type="button" aria-expanded="true">
                            Ẩn bản dịch
                        </button>

                    </div>

                </header>


                <article class="reading-paired-content" id="readingEnglishContent"></article>

            </section>

        </main>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="assets/js/core/supabase-config.js"></script>

    <script src="assets/js/core/auth-guard.js"></script>

    <script src="assets/js/english/reading.js?v=3"></script>

    <script src="assets/js/core/pwa.js"></script>

</body>

</html>
