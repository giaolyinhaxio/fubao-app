<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#eef8f1">

    <title>Danh sách từ vựng | FuBao</title>

    <link rel="manifest" href="manifest.json">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <meta name="apple-mobile-web-app-title" content="FuBao">

    <link rel="stylesheet" href="style.css?v=46">
</head>

<body class="tioong-page">

    <div class="app-container sub-page-container">

        <header class="sub-page-header">
            <a class="back-button" href="vocabulary.html">
                <span>‹</span>
                Flashcard
            </a>
        </header>


        <section class="vocabulary-list-heading">
            <p>KHO TỪ VỰNG</p>

            <h1>Danh sách từ</h1>

            <span>
                Xem và tìm kiếm từ đã nhập
            </span>
        </section>


        <section class="vocabulary-search-section">
            <input id="vocabularySearchInput" type="search" placeholder="Tìm bằng Anh, Việt hoặc Nhật..."
                autocomplete="off">

            <button id="searchVocabularyButton" type="button">
                Tìm
            </button>
        </section>

        <section class="vocabulary-filter-section">
            <label for="vocabularyStatusFilter">
                Trạng thái
            </label>

            <select id="vocabularyStatusFilter">
                <option value="all">
                    Tất cả
                </option>

                <option value="favorite">
                    Yêu thích
                </option>

                <option value="new">
                    Chưa học
                </option>

                <option value="again">
                    Chưa nhớ
                </option>

                <option value="learning">
                    Hơi nhớ
                </option>

                <option value="known">
                    Đã nhớ
                </option>
            </select>
        </section>


        <section class="vocabulary-list-information">
            <strong id="vocabularyListCount">
                Đang tải...
            </strong>
        </section>


        <main class="vocabulary-list-container" id="vocabularyListContainer">
            <article class="vocabulary-list-loading">
                Đang tải danh sách từ...
            </article>
        </main>


        <nav class="vocabulary-pagination" aria-label="Chuyển trang từ vựng">
            <button id="previousVocabularyPage" type="button" disabled>
                ‹ Trang trước
            </button>

            <span id="vocabularyPageNumber">
                Trang 1
            </span>

            <button id="nextVocabularyPage" type="button" disabled>
                Trang sau ›
            </button>
        </nav>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase-config.js"></script>

    <script src="auth-guard.js"></script>

    <script src="vocabulary-list.js?v=6"></script>

    <script src="pwa.js"></script>

</body>

</html>
