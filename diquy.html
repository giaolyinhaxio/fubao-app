<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#ffeef4">

    <title>Diquy | Fubao</title>

    <link rel="manifest" href="manifest.json">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <meta name="apple-mobile-web-app-title" content="Fubao">

    <link rel="stylesheet" href="style.css?v=25">
</head>

<body class="diquy-page">

    <div class="app-container sub-page-container">

        <!-- Thanh trên cùng -->
        <header class="sub-page-header">
            <a class="back-button" href="index.html">
                <span>‹</span>
                Trang chủ
            </a>
        </header>

        <!-- Giới thiệu -->
        <section class="profile-heading">
            <h1>Diquy</h1>
            <p id="diquyCurrentDate">
                Đang tải ngày...
            </p>
        </section>

        <!-- Lịch hôm nay -->
        <section class="today-schedule-section">

            <div class="section-heading-row">
                <div>
                    <p class="section-label">LỊCH TRÌNH</p>
                    <h2>Hôm nay</h2>
                </div>

                <button class="small-action-button" id="refreshScheduleButton" type="button">
                    ↻
                </button>
            </div>

            <div class="schedule-table-wrapper">
                <table class="schedule-table today-schedule-table" aria-label="Lịch trình hôm nay">
                    <thead>
                        <tr>
                            <th>Giờ</th>
                            <th>Lịch trình</th>
                            <th>Hoàn&nbsp;thành</th>
                        </tr>
                    </thead>

                    <tbody id="diquyTodaySchedule">
                        <tr class="schedule-loading-row">
                            <td colspan="3">
                                🗓️ Lịch hôm nay đang được tải...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </section>

        <!-- Chức năng -->
        <section class="diquy-actions">

            <button class="main-action-button" id="openWeekScheduleButton" type="button">
                <span>📅</span>

                <span class="action-text">
                    <strong>Xem lịch tuần</strong>
                    <small>Xem lịch học và lịch làm cả tuần</small>
                </span>

                <span class="action-arrow">›</span>
            </button>

        </section>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="app.js?v=24"></script>
    <script src="pwa.js"></script>
</body>

</html>
