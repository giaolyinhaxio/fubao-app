<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#fff7fa">

    <title>FuBao</title>

    <link rel="manifest" href="manifest.json">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <meta name="apple-mobile-web-app-title" content="FuBao">

    <link rel="stylesheet" href="style.css?v=31">
</head>

<body class="home-page">

    <div class="app-container">

        <p class="home-current-date" id="currentDate">
            Đang tải ngày...
        </p>

        <div class="home-account-bar">
            <p class="current-user-email" id="currentUserEmail">
                Đang tải tài khoản...
            </p>

            <button class="logout-button" id="logoutButton" type="button">
                Đăng xuất
            </button>
        </div>

        <header class="home-header">
            <h1>FuBao</h1>
        </header>

        <!-- Bộ đếm ngày yêu -->
        <section class="love-counter">
            <div class="love-counter-circle">
                <p class="love-counter-label">ĐANG YÊU</p>

                <p class="love-counter-number" id="loveDays">
                    0
                </p>

                <p class="love-counter-unit">NGÀY</p>
            </div>
            <div class="love-duration">
                <div class="love-duration-item">
                    <strong id="loveYears">0</strong>
                    <span>NĂM</span>
                </div>

                <div class="love-duration-item">
                    <strong id="loveMonths">0</strong>
                    <span>THÁNG</span>
                </div>

                <div class="love-duration-item">
                    <strong id="loveWeeks">0</strong>
                    <span>TUẦN</span>
                </div>

                <div class="love-duration-item">
                    <strong id="loveRemainingDays">0</strong>
                    <span>NGÀY</span>
                </div>
            </div>
        </section>

        <main class="home-menu">

            <a class="space-card diquy-card" href="diquy.html">
                <div class="space-icon">
                    <img class="space-icon-image" src="images/diquy.jpg" alt="Diquy">
                </div>

                <div class="space-content">
                    <h2>DiQuy</h2>
                </div>
            </a>


            <a class="space-card tioong-card" href="tioong.html">
                <div class="space-icon">
                    <img class="space-icon-image" src="images/tioong.jpg" alt="TiOong">
                </div>

                <div class="space-content">
                    <h2>TiOong</h2>
                </div>
            </a>


            <a class="space-card together-card" href="chung-minh.html">
                <div class="space-icon">
                    <img class="space-icon-image" src="images/chung-minh.png" alt="Chúng mình">
                </div>

                <div class="space-content">
                    <h2>Chúng mình</h2>
                </div>
            </a>

        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="auth-guard.js"></script>
    <script src="app.js?v=25"></script>
    <script src="pwa.js"></script>
</body>

</html>
